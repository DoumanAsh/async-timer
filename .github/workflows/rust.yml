name: Rust

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  check-regular:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    uses: DoumanAsh/douman-ci/.github/workflows/rust.yml@master
    with:
      runs-on: ${{ matrix.runner }}
      min-rustc-version: "1.85.0"
      cargo-features: "c_wrapper"
      cargo-no-features: true

  check-tokio:
    if: github.event.pull_request.draft == false
    uses: DoumanAsh/douman-ci/.github/workflows/rust.yml@master
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    with:
      runs-on: ${{ matrix.runner }}
      min-rustc-version: "1.85.0"
      cargo-features: "tokio1"

  wasm-platform-test:
    needs: [check-regular, check-tokio]
    if: github.event.pull_request.draft == false
    uses: DoumanAsh/douman-ci/.github/workflows/wasm-rust.yml@master
    with:
      cargo-test-run: false

  cross-platform-test:
    needs: [check-regular, check-tokio]
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        target: [
          "arm-unknown-linux-musleabi",
          "i586-unknown-linux-musl",
          "powerpc-unknown-linux-gnu",
          "aarch64-unknown-linux-musl",
          #"mips-unknown-linux-musl",
          #"mips64-unknown-linux-gnuabi64"
        ]
    uses: DoumanAsh/douman-ci/.github/workflows/cross-rust.yml@master
    with:
      cargo-features: "tokio1"
      cargo-no-features: true
      cargo-test-release: true
      cargo-target: ${{ matrix.target }}
